name: Deploy portfolio to Pages

on:
  push:
    branches: [main]
    paths:
      - "sitio/**"
      - "coloquios/actualizacion/demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public artifact
        run: |
          mkdir -p _site/coloquios/actualizacion/demo
          cp -R sitio/. _site/
          cp coloquios/actualizacion/demo/*.{html,css,js,ttf,txt} _site/coloquios/actualizacion/demo/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
